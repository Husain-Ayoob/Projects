# GRUB Configuration for AI Diagnostic Boot Drive
# This file will be used when creating the bootable image

set timeout=5
set default=0

# Load EFI video drivers
insmod efi_gop
insmod efi_uga

# Load fonts
loadfont unicode

# Set theme colors
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "AI Diagnostic Boot Drive (Normal Mode)" {
    set gfxpayload=keep
    linux /boot/vmlinuz boot=live components quiet splash
    initrd /boot/initrd.img
}

menuentry "AI Diagnostic Boot Drive (Safe Mode)" {
    set gfxpayload=keep
    linux /boot/vmlinuz boot=live components nomodeset quiet splash readonly
    initrd /boot/initrd.img
}

menuentry "AI Diagnostic Boot Drive (Debug Mode)" {
    set gfxpayload=keep
    linux /boot/vmlinuz boot=live components debug verbose
    initrd /boot/initrd.img
}

menuentry "Boot from First Hard Disk" {
    chainloader (hd0)+1
}

menuentry "System Memory Test (Memtest86+)" {
    linux /boot/memtest86+.bin
}
